name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: pip install "Pillow>=9.0"

      - name: Build icon (8-bit, deterministic)
        run: python tools/make_icon.py

      - name: Package zip
        run: python tools/build_release.py

      - name: List artifact
        run: ls -la dist/

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
